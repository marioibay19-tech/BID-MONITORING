<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bidding Monitoring</title>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#f7f7f8; --card:#fff; --text:#1c1c1e; --sub:#6b6b70; --border:#e3e3e6;
  --accent:#2563eb; --accent2:#1d4ed8; --danger:#dc2626; --head:#f1f2f4; --good:#16a34a; --warn:#d97706;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#17181a;--card:#212226;--text:#eee;--sub:#9a9aa0;--border:#33343a;--head:#2a2b30;}
}
:root[data-theme="dark"]{--bg:#17181a;--card:#212226;--text:#eee;--sub:#9a9aa0;--border:#33343a;--head:#2a2b30;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
header{padding:16px 18px 8px;}
h1{font-size:20px;margin:0 0 4px;}
.sub{color:var(--sub);font-size:13px;}
.tabs{display:flex;gap:8px;padding:0 18px;margin:14px 0;}
.tab{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:14px;color:var(--text);}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.wrap{padding:0 18px 40px;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
.card .n{font-size:17px;font-weight:700;}
.card .l{font-size:11px;color:var(--sub);margin-top:2px;}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;}
.toolbar input[type=text]{flex:1;min-width:140px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;}
.toolbar select{padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer;}
button.add{background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:14px;cursor:pointer;margin-left:auto;}
button.add:hover{background:var(--accent2);}
.banner{background:#fef3c7;color:#78350f;border:1px solid #fcd34d;padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:10px;display:none;}
.banner.show{display:block;}
.tablecard{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.scroll{overflow-x:auto;}
table{border-collapse:collapse;width:100%;min-width:640px;}
th,td{text-align:left;padding:9px 11px;font-size:13px;border-bottom:1px solid var(--border);white-space:nowrap;}
td.wrap-cell{white-space:normal;max-width:220px;}
th{background:var(--head);color:var(--sub);font-weight:600;cursor:pointer;user-select:none;}
th.nosort{cursor:default;}
tr:last-child td{border-bottom:none;}
tr.group-row td{background:var(--head);font-weight:600;cursor:pointer;}
tr.lowest{background:rgba(22,163,74,.08);}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;}
.badge.Pending{background:#fef3c7;color:#92400e;}
.badge.Passed{background:#dcfce7;color:#166534;}
.badge.Failed{background:#fee2e2;color:#991b1b;}
.badge.For.Evaluation, .badge.ForEvaluation{background:#dbeafe;color:#1e40af;}
.lowbadge{font-size:10px;background:var(--good);color:#fff;padding:1px 6px;border-radius:8px;margin-left:6px;}
.actions button{border:none;background:none;cursor:pointer;font-size:13px;color:var(--accent);margin-right:8px;}
.actions button.del{color:var(--danger);}
.empty{padding:30px;text-align:center;color:var(--sub);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:10;}
.overlay.open{display:flex;}
.modal{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px;max-height:85vh;overflow-y:auto;}
@media(min-width:600px){.overlay{align-items:center;}.modal{border-radius:16px;}}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;}
.field textarea{min-height:110px;resize:vertical;}
.modal h2{font-size:16px;margin:0 0 14px;}
.modalbtns{display:flex;gap:10px;margin-top:6px;}
.modalbtns button{flex:1;padding:10px;border-radius:8px;border:none;font-size:14px;cursor:pointer;}
.modalbtns .save{background:var(--accent);color:#fff;}
.modalbtns .cancel{background:var(--head);color:var(--text);}
.cv-section{margin-bottom:16px;}
.cv-section h3{font-size:13px;color:var(--sub);margin:0 0 6px;text-transform:uppercase;letter-spacing:.03em;}
.cv-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;}
.cv-row b{font-weight:600;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute;top:0;left:0;width:100%;padding:20px;}
}
</style>
</head>
<body>
<header>
  <h1>Bidding Monitoring</h1>
  <div class="sub" id="statusLine">Financial and Technical bid tracking</div>
</header>
<div class="tabs">
  <div class="tab active" data-tab="financial">Financial</div>
  <div class="tab" data-tab="technical">Technical</div>
</div>
<div class="wrap">
  <div class="banner" id="banner"></div>
  <div class="cards" id="cards"></div>
  <div class="toolbar">
    <input type="text" id="search" placeholder="Search...">
    <select id="sortSel"></select>
    <button class="btn" id="dirBtn">↑ Asc</button>
    <button class="btn" id="exportBtn">Export CSV</button>
    <button class="add" id="addBtn">+ Add Entry</button>
  </div>
  <div class="tablecard"><div class="scroll" id="tableHost"></div></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Add Entry</h2>
    <div id="formHost"></div>
    <div class="modalbtns">
      <button class="cancel" id="cancelBtn">Cancel</button>
      <button class="save" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<div class="overlay" id="cvOverlay">
  <div class="modal">
    <div id="printArea"></div>
    <div class="modalbtns">
      <button class="cancel" id="cvCloseBtn">Close</button>
      <button class="save" id="cvPrintBtn">Print</button>
    </div>
  </div>
</div>

<datalist id="dl-people"></datalist>
<datalist id="dl-bidders"></datalist>

<script>
// PASTE YOUR FIREBASE CONFIG HERE (see README) ↓
const firebaseConfig = {
  apiKey: "AIzaSyBfL_LTNUoO28ls9KEsKreMdXHwfHFqndo",
  authDomain: "bid-monitoring-f1308.firebaseapp.com",
  projectId: "bid-monitoring-f1308",
  storageBucket: "bid-monitoring-f1308.firebasestorage.app",
  messagingSenderId: "130105353479",
  appId: "1:130105353479:web:c527625f42ff6e82a8d1a2",
  measurementId: "G-VT4BDEPMNF"
};
firebase.initializeApp(firebaseConfig);
const fireDb = firebase.firestore();

const STATUS_OPTS = ["Pending","For Evaluation","Passed","Failed"];
const FIN_FIELDS = [
  {key:"contractId", label:"Contract ID", type:"text"},
  {key:"contractName", label:"Contract Name", type:"text"},
  {key:"pointPerson", label:"Point Person", type:"combo", list:"dl-people"},
  {key:"bidOpeningDate", label:"Bid Opening Date", type:"date"},
  {key:"financialStatus", label:"Financial Status", type:"select", options:STATUS_OPTS},
  {key:"bidder", label:"Bidder", type:"combo", list:"dl-bidders"},
  {key:"abcPrice", label:"ABC Price", type:"number"},
  {key:"biddersPrice", label:"Bidder's Price", type:"number"},
];
const TECH_FIELDS = [
  {key:"contractId", label:"Contract ID", type:"text"},
  {key:"contractName", label:"Contract Name", type:"text"},
  {key:"pointPerson", label:"Point Person", type:"combo", list:"dl-people"},
  {key:"postQualDate", label:"Post Qualification Date", type:"date"},
  {key:"corrections", label:"Corrections of the Technical", type:"textarea"},
  {key:"locationEquipment", label:"Location of Equipment", type:"text"},
  {key:"bidWinner", label:"Bid Winner", type:"combo", list:"dl-bidders"},
];
const SORTS = {
  financial: [["contractId","Contract ID"],["bidOpeningDate","Bid Opening Date"],["biddersPrice","Bidder's Price"]],
  technical: [["contractId","Contract ID"],["postQualDate","Post Qual. Date"],["pointPerson","Point Person"]],
};

let state = {financial:[], technical:[]};
let tab = "financial";
let editingId = null;
let search = "";
let sortKey = "contractId";
let sortDir = "asc";
const LOCAL_KEY = "bidding-monitor-data";

function esc(s){ return (s??"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function genId(){ return "id"+Date.now()+Math.random().toString(36).slice(2,6); }
function fields(){ return tab==="financial" ? FIN_FIELDS : TECH_FIELDS; }
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }

function showBanner(msg, ms){
  const b = document.getElementById("banner");
  b.textContent = msg; b.classList.add("show");
  clearTimeout(b._t);
  b._t = setTimeout(()=>b.classList.remove("show"), ms||4000);
}

/* ---------- storage ---------- */
function loadLocal(){
  try{ const raw = localStorage.getItem(LOCAL_KEY); if(raw) state = JSON.parse(raw); }catch(e){}
}
function saveLocal(){ try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); }catch(e){} }

async function initStorage(){
  loadLocal(); // one-time: pick up anything already in this browser, then migrate to shared storage
  document.getElementById("statusLine").textContent = "Connecting...";
  try{
    const fSnap = await fireDb.collection("financial").get();
    const tSnap = await fireDb.collection("technical").get();
    if(fSnap.empty && tSnap.empty && (state.financial.length || state.technical.length)){
      for(const r of state.financial){ const {id,...d} = r; await fireDb.collection("financial").doc(id).set(d); }
      for(const r of state.technical){ const {id,...d} = r; await fireDb.collection("technical").doc(id).set(d); }
    }
  }catch(e){ console.error(e); }
  document.getElementById("statusLine").textContent = "Live — shared with everyone who opens this page";
  fireDb.collection("financial").onSnapshot(snap=>{ state.financial = snap.docs.map(d=>({id:d.id, ...d.data()})); renderAll(); }, e=>console.error(e));
  fireDb.collection("technical").onSnapshot(snap=>{ state.technical = snap.docs.map(d=>({id:d.id, ...d.data()})); renderAll(); }, e=>console.error(e));
}

async function saveRow(coll, data, id){
  try{
    if(id){ await fireDb.collection(coll).doc(id).set(data); }
    else { await fireDb.collection(coll).add(data); }
  }catch(e){ showBanner("Couldn't save — check your connection."); return; }
  checkCrossRef(coll, data.contractId);
}
async function deleteRow(coll, id){
  try{ await fireDb.collection(coll).doc(id).delete(); }
  catch(e){ showBanner("Couldn't delete — check your connection."); }
}
function checkCrossRef(coll, contractId){
  if(!contractId) return;
  const other = coll==="financial" ? "technical" : "financial";
  const exists = state[other].some(r=>r.contractId===contractId);
  if(!exists){
    const otherName = other==="financial" ? "Financial" : "Technical";
    showBanner(`Note: Contract ID "${contractId}" has no matching entry on the ${otherName} page yet.`);
  }
}

/* ---------- datalists ---------- */
function refreshDatalists(){
  const people = new Set(), bidders = new Set();
  [...state.financial, ...state.technical].forEach(r=>{
    if(r.pointPerson) people.add(r.pointPerson);
    if(r.bidder) bidders.add(r.bidder);
    if(r.bidWinner) bidders.add(r.bidWinner);
  });
  document.getElementById("dl-people").innerHTML = [...people].map(p=>`<option value="${esc(p)}">`).join("");
  document.getElementById("dl-bidders").innerHTML = [...bidders].map(b=>`<option value="${esc(b)}">`).join("");
}

/* ---------- filtering / sorting ---------- */
function filtered(){
  let rows = state[tab];
  if(search){
    const q = search.toLowerCase();
    rows = rows.filter(r => fields().some(f => (r[f.key]||"").toString().toLowerCase().includes(q)));
  }
  rows = [...rows].sort((a,b)=>{
    let av=a[sortKey], bv=b[sortKey];
    if(sortKey==="biddersPrice"){ av=num(av); bv=num(bv); }
    else { av=(av||"").toString().toLowerCase(); bv=(bv||"").toString().toLowerCase(); }
    if(av<bv) return sortDir==="asc"?-1:1;
    if(av>bv) return sortDir==="asc"?1:-1;
    return 0;
  });
  return rows;
}

/* ---------- summary cards ---------- */
function renderCards(){
  const host = document.getElementById("cards");
  if(tab==="financial"){
    const rows = state.financial;
    const contracts = new Set(rows.map(r=>r.contractId).filter(Boolean));
    let abcTotal = 0, awardedTotal = 0;
    contracts.forEach(cid=>{
      const grp = rows.filter(r=>r.contractId===cid);
      abcTotal += num(grp[0].abcPrice);
      const prices = grp.map(r=>num(r.biddersPrice)).filter(p=>p>0);
      if(prices.length) awardedTotal += Math.min(...prices);
    });
    host.innerHTML = [
      ["Contracts", contracts.size],
      ["Bids Logged", rows.length],
      ["Total ABC", "₱"+abcTotal.toLocaleString()],
      ["Lowest Bids Total", "₱"+awardedTotal.toLocaleString()],
    ].map(c=>`<div class="card"><div class="n">${c[1]}</div><div class="l">${c[0]}</div></div>`).join("");
  } else {
    const rows = state.technical;
    const withWinner = rows.filter(r=>r.bidWinner).length;
    host.innerHTML = [
      ["Contracts", rows.length],
      ["Winner Assigned", withWinner],
      ["Awaiting Winner", rows.length - withWinner],
    ].map(c=>`<div class="card"><div class="n">${c[1]}</div><div class="l">${c[0]}</div></div>`).join("");
  }
}

/* ---------- table render ---------- */
function badge(status){
  const cls = (status||"").replace(/\s+/g,"");
  return `<span class="badge ${cls}">${esc(status||"—")}</span>`;
}

function renderTable(){
  const host = document.getElementById("tableHost");
  const rows = filtered();
  if(rows.length===0){
    host.innerHTML = `<div class="empty">No entries found. Try "+ Add Entry" or clear your search.</div>`;
    return;
  }
  if(tab==="technical"){
    let html = "<table><thead><tr>";
    TECH_FIELDS.forEach(f=> html += `<th data-key="${f.key}">${f.label}${sortKey===f.key?(sortDir==="asc"?" ▲":" ▼"):""}</th>`);
    html += `<th class="nosort"></th></tr></thead><tbody>`;
    rows.forEach(r=>{
      html += "<tr>";
      TECH_FIELDS.forEach(f=>{
        const cls = f.type==="textarea" ? ' class="wrap-cell"' : "";
        html += `<td${cls}>${esc(r[f.key])}</td>`;
      });
      html += `<td class="actions"><button onclick="viewContract('${esc(r.contractId)}')">View</button><button onclick="openEdit('${r.id}')">Edit</button><button class="del" onclick="askDelete('${r.id}')">Delete</button></td></tr>`;
    });
    html += "</tbody></table>";
    host.innerHTML = html;
    host.querySelectorAll("th[data-key]").forEach(th=>th.addEventListener("click", ()=>{
      const k = th.dataset.key;
      if(sortKey===k) sortDir = sortDir==="asc"?"desc":"asc"; else { sortKey=k; sortDir="asc"; }
      syncSortControls(); renderTable();
    }));
    return;
  }
  // financial: grouped by contract
  const groups = {};
  const order = [];
  rows.forEach(r=>{
    const cid = r.contractId || "(no ID)";
    if(!groups[cid]){ groups[cid]=[]; order.push(cid); }
    groups[cid].push(r);
  });
  let html = "<table><thead><tr><th class='nosort'>Point Person</th><th class='nosort'>Bid Opening</th><th class='nosort'>Status</th><th class='nosort'>Bidder</th><th class='nosort'>ABC Price</th><th class='nosort'>Bidder's Price</th><th class='nosort'></th></tr></thead><tbody>";
  order.forEach(cid=>{
    const grp = groups[cid];
    const prices = grp.map(r=>num(r.biddersPrice)).filter(p=>p>0);
    const minPrice = prices.length ? Math.min(...prices) : null;
    html += `<tr class="group-row" onclick="viewContract('${esc(cid)}')"><td colspan="7">${esc(grp[0].contractName||"")} — Contract ${esc(cid)} <span style="font-weight:400;color:var(--sub)">(${grp.length} bid${grp.length===1?"":"s"}, tap to view)</span></td></tr>`;
    grp.forEach(r=>{
      const isLowest = minPrice!==null && num(r.biddersPrice)===minPrice && num(r.biddersPrice)>0;
      html += `<tr class="${isLowest?"lowest":""}"><td>${esc(r.pointPerson)}</td><td>${esc(r.bidOpeningDate)}</td><td>${badge(r.financialStatus)}</td><td>${esc(r.bidder)}${isLowest?'<span class="lowbadge">LOWEST</span>':""}</td><td>${r.abcPrice?"₱"+num(r.abcPrice).toLocaleString():""}</td><td>${r.biddersPrice?"₱"+num(r.biddersPrice).toLocaleString():""}</td><td class="actions"><button onclick="event.stopPropagation();openEdit('${r.id}')">Edit</button><button class="del" onclick="event.stopPropagation();askDelete('${r.id}')">Delete</button></td></tr>`;
    });
  });
  html += "</tbody></table>";
  host.innerHTML = html;
}

window.askDelete = function(id){ if(confirm("Delete this entry?")) deleteRow(tab, id); };

function renderAll(){
  renderCards(); renderTable(); refreshDatalists();
}

/* ---------- sort controls ---------- */
function syncSortControls(){
  const sel = document.getElementById("sortSel");
  sel.innerHTML = SORTS[tab].map(s=>`<option value="${s[0]}" ${sortKey===s[0]?"selected":""}>${s[1]}</option>`).join("");
  document.getElementById("dirBtn").textContent = sortDir==="asc" ? "↑ Asc" : "↓ Desc";
}

/* ---------- modal form ---------- */
function openAdd(){
  editingId = null;
  document.getElementById("modalTitle").textContent = "Add " + (tab==="financial"?"Financial":"Technical") + " Entry";
  buildForm({});
  document.getElementById("overlay").classList.add("open");
}
window.openEdit = function(id){
  editingId = id;
  const row = state[tab].find(r=>r.id===id);
  document.getElementById("modalTitle").textContent = "Edit Entry";
  buildForm(row);
  document.getElementById("overlay").classList.add("open");
}
function buildForm(data){
  const host = document.getElementById("formHost");
  host.innerHTML = fields().map(f=>{
    const val = esc(data[f.key]);
    if(f.type==="select"){
      return `<div class="field"><label>${f.label}</label><select data-key="${f.key}">` +
        f.options.map(o=>`<option value="${o}" ${data[f.key]===o?"selected":""}>${o}</option>`).join("") +
        `</select></div>`;
    }
    if(f.type==="combo"){
      return `<div class="field"><label>${f.label}</label><input data-key="${f.key}" list="${f.list}" value="${val}"></div>`;
    }
    if(f.type==="textarea"){
      return `<div class="field"><label>${f.label}</label><textarea data-key="${f.key}">${val}</textarea></div>`;
    }
    return `<div class="field"><label>${f.label}</label><input data-key="${f.key}" type="${f.type}" value="${val}"></div>`;
  }).join("");
  const idInput = host.querySelector('[data-key="contractId"]');
  if(idInput){
    idInput.addEventListener("change", ()=>{
      const cid = idInput.value.trim();
      const match = [...state.financial, ...state.technical].find(r=>r.contractId===cid && r.id!==editingId);
      if(match){
        const nameField = host.querySelector('[data-key="contractName"]');
        const ppField = host.querySelector('[data-key="pointPerson"]');
        if(nameField && !nameField.value) nameField.value = match.contractName || "";
        if(ppField && !ppField.value) ppField.value = match.pointPerson || "";
      }
    });
  }
}
function closeModal(){ document.getElementById("overlay").classList.remove("open"); }
function saveForm(){
  const inputs = document.querySelectorAll("#formHost [data-key]");
  const obj = {};
  inputs.forEach(i=> obj[i.dataset.key] = i.value.trim());
  saveRow(tab, obj, editingId);
  closeModal();
}

/* ---------- combined contract view ---------- */
window.viewContract = function(cid){
  const fin = state.financial.filter(r=>r.contractId===cid);
  const tech = state.technical.find(r=>r.contractId===cid);
  const name = (fin[0]&&fin[0].contractName) || (tech&&tech.contractName) || "";
  const pp = (fin[0]&&fin[0].pointPerson) || (tech&&tech.pointPerson) || "";
  let html = `<h2>${esc(name)||"Contract "+esc(cid)}</h2><div class="cv-row"><span>Contract ID</span><b>${esc(cid)}</b></div><div class="cv-row"><span>Point Person</span><b>${esc(pp)}</b></div>`;
  html += `<div class="cv-section"><h3>Financial</h3>`;
  if(fin.length){
    fin.forEach(r=>{
      html += `<div class="cv-row"><span>${esc(r.bidder)||"Bidder"} — ${badge(r.financialStatus)}</span><b>${r.biddersPrice?"₱"+num(r.biddersPrice).toLocaleString():"—"}</b></div>`;
    });
    html += `<div class="cv-row"><span>ABC Price</span><b>${fin[0].abcPrice?"₱"+num(fin[0].abcPrice).toLocaleString():"—"}</b></div>`;
    html += `<div class="cv-row"><span>Bid Opening Date</span><b>${esc(fin[0].bidOpeningDate)||"—"}</b></div>`;
  } else html += `<div class="cv-row"><span>No financial entries yet</span></div>`;
  html += `</div><div class="cv-section"><h3>Technical</h3>`;
  if(tech){
    html += `<div class="cv-row"><span>Post Qualification Date</span><b>${esc(tech.postQualDate)||"—"}</b></div>`;
    html += `<div class="cv-row"><span>Location of Equipment</span><b>${esc(tech.locationEquipment)||"—"}</b></div>`;
    html += `<div class="cv-row"><span>Bid Winner</span><b>${esc(tech.bidWinner)||"—"}</b></div>`;
    html += `<div class="cv-section"><h3>Corrections</h3><div>${esc(tech.corrections)||"—"}</div></div>`;
  } else html += `<div class="cv-row"><span>No technical entry yet</span></div>`;
  html += `</div>`;
  document.getElementById("printArea").innerHTML = html;
  document.getElementById("cvOverlay").classList.add("open");
}

/* ---------- CSV export ---------- */
async function exportCsv(){
  const rows = filtered();
  const fs = fields();
  const lines = [fs.map(f=>f.label).join(",")];
  rows.forEach(r=>{
    lines.push(fs.map(f=>`"${(r[f.key]||"").toString().replace(/"/g,'""')}"`).join(","));
  });
  const csv = lines.join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `${tab}-bids.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ---------- wiring ---------- */
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    tab = t.dataset.tab;
    sortKey = SORTS[tab][0][0]; sortDir = "asc";
    document.getElementById("search").value = ""; search = "";
    syncSortControls(); renderAll();
  });
});
document.getElementById("addBtn").addEventListener("click", openAdd);
document.getElementById("cancelBtn").addEventListener("click", closeModal);
document.getElementById("saveBtn").addEventListener("click", saveForm);
document.getElementById("overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") closeModal(); });
document.getElementById("cvCloseBtn").addEventListener("click", ()=>document.getElementById("cvOverlay").classList.remove("open"));
document.getElementById("cvOverlay").addEventListener("click", e=>{ if(e.target.id==="cvOverlay") e.currentTarget.classList.remove("open"); });
document.getElementById("cvPrintBtn").addEventListener("click", ()=>window.print());
document.getElementById("search").addEventListener("input", e=>{ search = e.target.value; renderTable(); });
document.getElementById("sortSel").addEventListener("change", e=>{ sortKey = e.target.value; renderTable(); });
document.getElementById("dirBtn").addEventListener("click", ()=>{ sortDir = sortDir==="asc"?"desc":"asc"; syncSortControls(); renderTable(); });
document.getElementById("exportBtn").addEventListener("click", exportCsv);

syncSortControls();
initStorage();
</script>
