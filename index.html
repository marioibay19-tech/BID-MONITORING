<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bidding Monitoring</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --paper:#F2F4F7; --card:#FFFFFF; --ink:#1B2430; --sub:#5B6472; --line:#D7DBE0;
  --gold:#C1440E; --gold-soft:#FBE6D8; --danger:#B3261E; --head:#EBEEF2; --good:#1E7B45; --warn:#C77700;
  --blue:#00306B; --blue2:#04448F;
  --sans:"Public Sans",-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#12161C;--card:#1B2129;--ink:#E9EBEE;--sub:#9AA2AB;--line:#2E3540;--head:#212831;--gold:#FF8A3D;--gold-soft:#3A2716;--blue:#0A4C93;--blue2:#1462B5;}
}
:root[data-theme="dark"]{--paper:#12161C;--card:#1B2129;--ink:#E9EBEE;--sub:#9AA2AB;--line:#2E3540;--head:#212831;--gold:#FF8A3D;--gold-soft:#3A2716;--blue:#0A4C93;--blue2:#1462B5;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
header{padding:18px 20px;background:var(--blue);border-bottom:4px solid var(--gold);}
h1{font-family:var(--sans);font-weight:800;font-size:22px;margin:0 0 4px;letter-spacing:.005em;color:#fff;}
.sub{color:#B9CBE3;font-size:13px;}
.wrap{padding:20px 20px 40px;}
.tablecard{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.cards{display:flex;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:8px 8px 0 0;border-bottom:none;}
.card{flex:1;min-width:120px;padding:12px 16px;border-right:1px solid var(--line);}
.card:last-child{border-right:none;}
.card .n{font-family:var(--sans);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;}
.card .l{font-size:11px;color:var(--sub);margin-top:2px;}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-top:none;padding:10px 16px;}
.toolbar input[type=text]{flex:1;min-width:140px;padding:8px 10px;border-radius:5px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:13px;font-family:var(--sans);}
.toolbar select{padding:8px 10px;border-radius:5px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:13px;}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 12px;border-radius:5px;font-size:13px;cursor:pointer;font-family:var(--sans);}
.btn:hover{border-color:var(--gold);}
button.add{background:var(--gold);color:#fff;border:1px solid var(--gold);padding:9px 16px;border-radius:5px;font-size:13px;cursor:pointer;margin-left:auto;font-family:var(--sans);font-weight:700;}
button.add:hover{background:var(--blue);border-color:var(--blue);}
.banner{background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold);padding:8px 14px;border-radius:5px;font-size:13px;margin:10px 0 0;display:none;}
.banner.show{display:block;}
.scroll{overflow-x:auto;}
.empty{padding:36px 20px;text-align:center;color:var(--sub);font-size:13px;}
.contract-card{border-bottom:1px solid var(--line);}
.contract-card:last-child{border-bottom:none;}
.contract-header{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;cursor:pointer;background:var(--head);flex-wrap:wrap;}
.contract-header:hover{background:var(--gold-soft);}
.chevron{color:var(--gold);font-size:11px;width:10px;flex-shrink:0;}
.entry-no{font-family:var(--sans);font-weight:700;color:var(--gold);font-size:12px;flex-shrink:0;}
.ch-idcol{display:flex;flex-direction:column;gap:4px;align-items:flex-start;width:210px;flex:0 0 210px;}
.ch-main{display:flex;flex-direction:column;gap:4px;flex:1;min-width:200px;}
.ch-meta-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.group-cid{color:var(--blue);font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--blue);padding:2px 8px;border-radius:4px;letter-spacing:.02em;max-width:100%;overflow-wrap:break-word;}
.group-name{font-family:var(--sans);font-weight:700;font-size:14px;white-space:normal;overflow-wrap:break-word;}
.group-pp{color:var(--ink);font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--line);padding:2px 8px;border-radius:4px;}
.group-count{color:var(--sub);font-size:12px;}
.winner-tag{background:var(--gold-soft);color:var(--gold);font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;max-width:100%;overflow-wrap:break-word;}
.viewlink{border:1px solid var(--line);background:var(--card);color:var(--blue);font-size:11px;padding:3px 9px;border-radius:4px;cursor:pointer;font-family:var(--sans);font-weight:600;margin-left:auto;}
.viewlink:hover{border-color:var(--blue);}
.contract-body{padding:14px 16px 20px;background:var(--card);}
.detail-wrap{display:flex;gap:28px;flex-wrap:wrap;}
.detail-col{flex:1;min-width:280px;max-width:100%;overflow-x:auto;}
.detail-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;font-size:13px;color:var(--blue);}
.mini-table{width:100%;border-collapse:collapse;}
.mini-table{table-layout:fixed;}
.mini-table th,.mini-table td{padding:6px 8px;font-size:12px;border-bottom:1px solid var(--line);text-align:left;white-space:normal;overflow-wrap:break-word;font-variant-numeric:tabular-nums;}
.mini-table th{color:var(--sub);font-weight:600;}
.empty-mini{color:var(--sub);font-size:12px;padding:8px 0;}
.techrow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12px;}
.techrow b{font-weight:600;text-align:right;}
.techrow-corr{padding:8px 0;font-size:12px;}
.techrow-corr span{display:block;color:var(--sub);margin-bottom:4px;font-weight:600;}
.badge{display:inline-block;padding:2px 9px;border-radius:3px;font-size:11px;font-weight:500;border:1px solid transparent;}
.badge.Pending{background:#F1E4CB;color:#7A5A1E;border-color:#D9BF87;}
.badge.Passed{background:#DDE7DF;color:#2F5138;border-color:#B7CCBC;}
.badge.Failed{background:#EFDAD8;color:#7A3029;border-color:#D9A9A3;}
.badge.For.Evaluation, .badge.ForEvaluation{background:#DCE2E8;color:#33475C;border-color:#B7C4D1;}
.actions button{border:none;background:none;cursor:pointer;font-size:12px;color:var(--sub);margin-right:10px;font-family:var(--sans);}
.actions button:hover{color:var(--ink);text-decoration:underline;}
.actions button.del:hover{color:var(--danger);}
.overlay{position:fixed;inset:0;background:rgba(20,20,18,.45);display:none;align-items:flex-end;justify-content:center;z-index:10;}
.overlay.open{display:flex;}
.modal{background:var(--card);width:100%;max-width:560px;border-radius:10px 10px 0 0;padding:20px;max-height:85vh;overflow-y:auto;border:1px solid var(--line);}
@media(min-width:600px){.overlay{align-items:center;}.modal{border-radius:10px;}}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%;padding:9px 10px;border-radius:5px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;font-family:var(--sans);}
.field textarea{min-height:90px;resize:none;overflow:hidden;}
.modal h2{font-family:var(--sans);font-weight:700;font-size:18px;margin:0 0 14px;color:var(--blue);}
.modalbtns{display:flex;gap:10px;margin-top:6px;}
.modalbtns button{flex:1;padding:10px;border-radius:5px;border:1px solid var(--line);font-size:14px;cursor:pointer;font-family:var(--sans);}
.modalbtns .save{background:var(--blue);color:#fff;border-color:var(--blue);}
.modalbtns .save:hover{background:var(--gold);border-color:var(--gold);}
.modalbtns .cancel{background:var(--paper);color:var(--ink);}
.cv-section{margin-bottom:16px;}
.cv-section h3{font-family:var(--sans);font-weight:700;font-size:12px;color:var(--blue);margin:0 0 6px;}
.cv-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;}
.cv-row b{font-weight:600;font-variant-numeric:tabular-nums;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute;top:0;left:0;width:100%;padding:20px;}
}
</style>
</head>
<body>
<header>
  <h1>Bidding Monitoring</h1>
  <div class="sub" id="statusLine">Every contract, its bids, and its technical record in one place.</div>
</header>
<div class="wrap">
  <div class="banner" id="banner"></div>
  <div class="cards" id="cards"></div>
  <div class="toolbar">
    <input type="text" id="search" placeholder="Search contracts...">
    <select id="sortSel"></select>
    <button class="btn" id="dirBtn">↑ Asc</button>
    <button class="btn" id="exportBtn">Export CSV</button>
    <button class="add" id="addBtn">+ Add Bid</button>
  </div>
  <div class="tablecard"><div class="scroll" id="tableHost"></div></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Add Bid</h2>
    <div id="formHost"></div>
    <div class="modalbtns">
      <button class="cancel" id="cancelBtn">Cancel</button>
      <button class="save" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<div class="overlay" id="cvOverlay">
  <div class="modal">
    <div id="printArea"></div>
    <div class="modalbtns">
      <button class="cancel" id="cvCloseBtn">Close</button>
      <button class="save" id="cvPrintBtn">Print</button>
    </div>
  </div>
</div>

<datalist id="dl-people"></datalist>
<datalist id="dl-bidders"></datalist>

<script>
// PASTE YOUR FIREBASE CONFIG HERE (see README) ↓
const firebaseConfig = {
  apiKey: "AIzaSyBfL_LTNUoO28ls9KEsKreMdXHwfHFqndo",
  authDomain: "bid-monitoring-f1308.firebaseapp.com",
  projectId: "bid-monitoring-f1308",
  storageBucket: "bid-monitoring-f1308.firebasestorage.app",
  messagingSenderId: "130105353479",
  appId: "1:130105353479:web:c527625f42ff6e82a8d1a2",
  measurementId: "G-VT4BDEPMNF"
};
firebase.initializeApp(firebaseConfig);
const fireDb = firebase.firestore();

const STATUS_OPTS = ["Pending","For Evaluation","Passed","Failed"];
const FIN_FIELDS = [
  {key:"contractId", label:"Contract ID", type:"text"},
  {key:"contractName", label:"Contract Name", type:"text"},
  {key:"pointPerson", label:"Point Person", type:"combo", list:"dl-people"},
  {key:"bidOpeningDate", label:"Bid Opening Date", type:"date"},
  {key:"financialStatus", label:"Financial Status", type:"select", options:STATUS_OPTS},
  {key:"bidder", label:"Bidder", type:"combo", list:"dl-bidders"},
  {key:"abcPrice", label:"ABC Price", type:"number"},
  {key:"biddersPrice", label:"Bidder's Price", type:"number"},
];
const TECH_FIELDS = [
  {key:"postQualDate", label:"Post Qualification Date", type:"date"},
  {key:"corrections", label:"Corrections of the Technical", type:"textarea"},
  {key:"locationEquipment", label:"Location of Equipment", type:"text"},
  {key:"bidWinner", label:"Bid Winner", type:"combo", list:"dl-bidders"},
];
const SORTS = [["contractId","Contract ID"],["contractName","Contract Name"],["pointPerson","Point Person"],["bidder","Bidder"]];

let state = {financial:[], technical:[]};
let editingId = null;
let formMode = "bid"; // "bid" | "technical"
let techContext = null; // {contractId, contractName, pointPerson, techId}
let search = "";
let sortKey = "contractId";
let sortDir = "asc";
let expandedGroups = new Set();
const LOCAL_KEY = "bidding-monitor-data";

function esc(s){ return (s??"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }

function showBanner(msg, ms){
  const b = document.getElementById("banner");
  b.textContent = msg; b.classList.add("show");
  clearTimeout(b._t);
  b._t = setTimeout(()=>b.classList.remove("show"), ms||4000);
}

/* ---------- storage ---------- */
function loadLocal(){
  try{ const raw = localStorage.getItem(LOCAL_KEY); if(raw) state = JSON.parse(raw); }catch(e){}
}

async function initStorage(){
  loadLocal(); // one-time: pick up anything already in this browser, then migrate to shared storage
  document.getElementById("statusLine").textContent = "Connecting...";
  try{
    const fSnap = await fireDb.collection("financial").get();
    const tSnap = await fireDb.collection("technical").get();
    if(fSnap.empty && tSnap.empty && (state.financial.length || state.technical.length)){
      for(const r of state.financial){ const {id,...d} = r; await fireDb.collection("financial").doc(id).set(d); }
      for(const r of state.technical){ const {id,...d} = r; await fireDb.collection("technical").doc(id).set(d); }
    }
  }catch(e){ console.error(e); }
  document.getElementById("statusLine").textContent = "Live — shared with everyone who opens this page";
  fireDb.collection("financial").onSnapshot(snap=>{ state.financial = snap.docs.map(d=>({id:d.id, ...d.data()})); renderAll(); }, e=>console.error(e));
  fireDb.collection("technical").onSnapshot(snap=>{ state.technical = snap.docs.map(d=>({id:d.id, ...d.data()})); renderAll(); }, e=>console.error(e));
}

async function saveRow(coll, data, id){
  try{
    if(id){ await fireDb.collection(coll).doc(id).set(data); }
    else { await fireDb.collection(coll).add(data); }
  }catch(e){ showBanner("Couldn't save — check your connection."); }
}
async function deleteRow(coll, id){
  try{ await fireDb.collection(coll).doc(id).delete(); }
  catch(e){ showBanner("Couldn't delete — check your connection."); }
}

/* ---------- datalists ---------- */
function refreshDatalists(){
  const people = new Set(), bidders = new Set();
  [...state.financial, ...state.technical].forEach(r=>{
    if(r.pointPerson) people.add(r.pointPerson);
    if(r.bidder) bidders.add(r.bidder);
    if(r.bidWinner) bidders.add(r.bidWinner);
  });
  document.getElementById("dl-people").innerHTML = [...people].map(p=>`<option value="${esc(p)}">`).join("");
  document.getElementById("dl-bidders").innerHTML = [...bidders].map(b=>`<option value="${esc(b)}">`).join("");
}

/* ---------- combined contract list ---------- */
function getContracts(){
  const ids = new Set();
  state.financial.forEach(r=>{ if(r.contractId) ids.add(r.contractId); });
  state.technical.forEach(r=>{ if(r.contractId) ids.add(r.contractId); });
  let list = [...ids].map(cid=>{
    const bids = state.financial.filter(r=>r.contractId===cid);
    const tech = state.technical.find(r=>r.contractId===cid) || null;
    const contractName = (bids[0]&&bids[0].contractName) || (tech&&tech.contractName) || "";
    const pointPerson = (bids[0]&&bids[0].pointPerson) || (tech&&tech.pointPerson) || "";
    const bidder = (bids[0] && bids[0].bidder) || "";
    return {cid, bids, tech, contractName, pointPerson, bidder};
  });
  if(search){
    const q = search.toLowerCase();
    list = list.filter(c=>{
      const hay = [c.cid, c.contractName, c.pointPerson,
        ...c.bids.map(b=>Object.values(b).join(" ")),
        c.tech?Object.values(c.tech).join(" "):""].join(" ").toLowerCase();
      return hay.includes(q);
    });
  }
  list.sort((a,b)=>{
    let av=(a[sortKey]||a.cid||"").toString().toLowerCase();
    let bv=(b[sortKey]||b.cid||"").toString().toLowerCase();
    if(av<bv) return sortDir==="asc"?-1:1;
    if(av>bv) return sortDir==="asc"?1:-1;
    return 0;
  });
  return list;
}

/* ---------- summary cards ---------- */
function renderCards(){
  const finRows = state.financial, techRows = state.technical;
  const contractIds = new Set([...finRows.map(r=>r.contractId), ...techRows.map(r=>r.contractId)].filter(Boolean));
  let abcTotal = 0, awardedTotal = 0;
  contractIds.forEach(cid=>{
    const grp = finRows.filter(r=>r.contractId===cid);
    if(grp.length){
      abcTotal += num(grp[0].abcPrice);
      const prices = grp.map(r=>num(r.biddersPrice)).filter(p=>p>0);
      if(prices.length) awardedTotal += Math.min(...prices);
    }
  });
  const withWinner = techRows.filter(r=>r.bidWinner).length;
  document.getElementById("cards").innerHTML = [
    ["Contracts", contractIds.size],
    ["Bids Logged", finRows.length],
    ["Total ABC", "₱"+abcTotal.toLocaleString()],
    ["Lowest Bids Total", "₱"+awardedTotal.toLocaleString()],
    ["Winner Assigned", withWinner],
  ].map(c=>`<div class="card"><div class="n">${c[1]}</div><div class="l">${c[0]}</div></div>`).join("");
}

/* ---------- main render ---------- */
function badge(status){
  const cls = (status||"").replace(/\s+/g,"");
  return `<span class="badge ${cls}">${esc(status||"—")}</span>`;
}

function renderContracts(){
  const host = document.getElementById("tableHost");
  const contracts = getContracts();
  if(!contracts.length){
    host.innerHTML = `<div class="empty">No contracts yet. Tap "+ Add Bid" to start.</div>`;
    return;
  }
  let html = "";
  contracts.forEach((c,idx)=>{
    const open = expandedGroups.has(c.cid);
    const winnerTag = (c.tech && c.tech.bidWinner) ? `<span class="winner-tag">Winner: ${esc(c.tech.bidWinner)}</span>` : "";
    html += `<div class="contract-card">`;
    html += `<div class="contract-header" onclick="toggleGroup('${esc(c.cid)}')">`;
    html += `<span class="chevron">${open?"▾":"▸"}</span>`;
    html += `<span class="entry-no">No. ${idx+1}</span>`;
    html += `<div class="ch-idcol"><span class="group-cid">Contract ${esc(c.cid)}</span>${winnerTag}</div>`;
    html += `<div class="ch-main"><span class="group-name">${esc(c.contractName||"Untitled contract")}</span>`;
    html += `<div class="ch-meta-row"><span class="group-pp">${esc(c.pointPerson)||"No point person"}</span><span class="group-count">${c.bids.length} bid${c.bids.length===1?"":"s"}</span></div></div>`;
    html += `<button class="viewlink" onclick="event.stopPropagation();viewContract('${esc(c.cid)}')">View</button>`;
    html += `</div>`;
    if(open){
      html += `<div class="contract-body"><div class="detail-wrap">`;
      html += `<div class="detail-col"><div class="detail-head"><span>Financial Bids</span><button class="viewlink" onclick="openAddBid('${esc(c.cid)}')">Add Bid</button></div>`;
      if(c.bids.length){
        html += `<table class="mini-table"><thead><tr><th>Bid Opening</th><th>Status</th><th>Bidder</th><th>ABC Price</th><th>Bidder's Price</th><th></th></tr></thead><tbody>`;
        c.bids.forEach(r=>{
          html += `<tr><td>${esc(r.bidOpeningDate)}</td><td>${badge(r.financialStatus)}</td><td>${esc(r.bidder)}</td><td>${r.abcPrice?"₱"+num(r.abcPrice).toLocaleString():""}</td><td>${r.biddersPrice?"₱"+num(r.biddersPrice).toLocaleString():""}</td><td class="actions"><button onclick="openEditBid('${r.id}')">Edit</button><button class="del" onclick="askDeleteBid('${r.id}')">Delete</button></td></tr>`;
        });
        html += `</tbody></table>`;
      } else html += `<div class="empty-mini">No bids yet.</div>`;
      html += `</div>`;
      html += `<div class="detail-col"><div class="detail-head"><span>Technical</span><button class="viewlink" onclick="openTechnical('${esc(c.cid)}')">${c.tech?"Edit":"Add"} Technical</button></div>`;
      if(c.tech){
        html += `<div class="techrow"><span>Post Qualification Date</span><b>${esc(c.tech.postQualDate)||"—"}</b></div>`;
        html += `<div class="techrow"><span>Location of Equipment</span><b>${esc(c.tech.locationEquipment)||"—"}</b></div>`;
        html += `<div class="techrow"><span>Bid Winner</span><b>${esc(c.tech.bidWinner)||"—"}</b></div>`;
        html += `<div class="techrow-corr"><span>Corrections</span><div style="white-space:pre-wrap;">${esc(c.tech.corrections)||"—"}</div></div>`;
      } else html += `<div class="empty-mini">No technical info yet.</div>`;
      html += `</div></div></div>`;
    }
    html += `</div>`;
  });
  host.innerHTML = html;
}
window.toggleGroup = function(cid){
  if(expandedGroups.has(cid)) expandedGroups.delete(cid); else expandedGroups.add(cid);
  renderContracts();
}
window.askDeleteBid = function(id){ if(confirm("Delete this bid?")) deleteRow("financial", id); };

function renderAll(){
  renderCards(); renderContracts(); refreshDatalists();
}

/* ---------- sort controls ---------- */
function syncSortControls(){
  const sel = document.getElementById("sortSel");
  sel.innerHTML = SORTS.map(s=>`<option value="${s[0]}" ${sortKey===s[0]?"selected":""}>${s[1]}</option>`).join("");
  document.getElementById("dirBtn").textContent = sortDir==="asc" ? "↑ Asc" : "↓ Desc";
}

/* ---------- modal form ---------- */
window.openAddBid = function(prefillCid){
  formMode = "bid"; editingId = null;
  document.getElementById("modalTitle").textContent = "Add Bid";
  buildForm(FIN_FIELDS, prefillCid ? {contractId:prefillCid} : {});
  document.getElementById("overlay").classList.add("open");
}
window.openEditBid = function(id){
  formMode = "bid"; editingId = id;
  const row = state.financial.find(r=>r.id===id);
  document.getElementById("modalTitle").textContent = "Edit Bid";
  buildForm(FIN_FIELDS, row);
  document.getElementById("overlay").classList.add("open");
}
window.openTechnical = function(cid){
  formMode = "technical";
  const c = getContracts().find(x=>x.cid===cid) || {cid, contractName:"", pointPerson:""};
  techContext = {contractId:cid, contractName:c.contractName, pointPerson:c.pointPerson, techId: c.tech?c.tech.id:null};
  document.getElementById("modalTitle").textContent = (c.tech?"Edit":"Add") + " Technical Info — Contract " + cid;
  buildForm(TECH_FIELDS, c.tech || {});
  document.getElementById("overlay").classList.add("open");
}
function buildForm(fieldsArr, data){
  const host = document.getElementById("formHost");
  host.innerHTML = fieldsArr.map(f=>{
    const val = esc(data[f.key]);
    if(f.type==="select"){
      return `<div class="field"><label>${f.label}</label><select data-key="${f.key}">` +
        f.options.map(o=>`<option value="${o}" ${data[f.key]===o?"selected":""}>${o}</option>`).join("") +
        `</select></div>`;
    }
    if(f.type==="combo"){
      return `<div class="field"><label>${f.label}</label><input data-key="${f.key}" list="${f.list}" value="${val}"></div>`;
    }
    if(f.type==="textarea"){
      return `<div class="field"><label>${f.label}</label><textarea data-key="${f.key}">${val}</textarea></div>`;
    }
    return `<div class="field"><label>${f.label}</label><input data-key="${f.key}" type="${f.type}" value="${val}"></div>`;
  }).join("");
  if(formMode==="bid"){
    const idInput = host.querySelector('[data-key="contractId"]');
    if(idInput){
      idInput.addEventListener("change", ()=>{
        const cid = idInput.value.trim();
        const match = [...state.financial, ...state.technical].find(r=>r.contractId===cid && r.id!==editingId);
        if(match){
          const nameField = host.querySelector('[data-key="contractName"]');
          const ppField = host.querySelector('[data-key="pointPerson"]');
          if(nameField && !nameField.value) nameField.value = match.contractName || "";
          if(ppField && !ppField.value) ppField.value = match.pointPerson || "";
        }
      });
    }
  }
  host.querySelectorAll("textarea").forEach(ta=>{
    const grow = ()=>{ ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; };
    ta.addEventListener("input", grow);
    grow();
  });
}
function closeModal(){ document.getElementById("overlay").classList.remove("open"); }
function saveForm(){
  const inputs = document.querySelectorAll("#formHost [data-key]");
  const obj = {};
  inputs.forEach(i=> obj[i.dataset.key] = i.value.trim());
  if(formMode==="bid"){
    saveRow("financial", obj, editingId);
  } else {
    obj.contractId = techContext.contractId;
    obj.contractName = techContext.contractName;
    obj.pointPerson = techContext.pointPerson;
    saveRow("technical", obj, techContext.techId);
  }
  closeModal();
}

/* ---------- combined contract view / print ---------- */
window.viewContract = function(cid){
  const fin = state.financial.filter(r=>r.contractId===cid);
  const tech = state.technical.find(r=>r.contractId===cid);
  const name = (fin[0]&&fin[0].contractName) || (tech&&tech.contractName) || "";
  const pp = (fin[0]&&fin[0].pointPerson) || (tech&&tech.pointPerson) || "";
  let html = `<h2>${esc(name)||"Contract "+esc(cid)}</h2><div class="cv-row"><span>Contract ID</span><b>${esc(cid)}</b></div><div class="cv-row"><span>Point Person</span><b>${esc(pp)}</b></div>`;
  html += `<div class="cv-section"><h3>Financial</h3>`;
  if(fin.length){
    fin.forEach(r=>{
      html += `<div class="cv-row"><span>${esc(r.bidder)||"Bidder"} — ${badge(r.financialStatus)}</span><b>${r.biddersPrice?"₱"+num(r.biddersPrice).toLocaleString():"—"}</b></div>`;
    });
    html += `<div class="cv-row"><span>ABC Price</span><b>${fin[0].abcPrice?"₱"+num(fin[0].abcPrice).toLocaleString():"—"}</b></div>`;
    html += `<div class="cv-row"><span>Bid Opening Date</span><b>${esc(fin[0].bidOpeningDate)||"—"}</b></div>`;
  } else html += `<div class="cv-row"><span>No financial entries yet</span></div>`;
  html += `</div><div class="cv-section"><h3>Technical</h3>`;
  if(tech){
    html += `<div class="cv-row"><span>Post Qualification Date</span><b>${esc(tech.postQualDate)||"—"}</b></div>`;
    html += `<div class="cv-row"><span>Location of Equipment</span><b>${esc(tech.locationEquipment)||"—"}</b></div>`;
    html += `<div class="cv-row"><span>Bid Winner</span><b>${esc(tech.bidWinner)||"—"}</b></div>`;
    html += `<div class="cv-section"><h3>Corrections</h3><div style="white-space:pre-wrap;">${esc(tech.corrections)||"—"}</div></div>`;
  } else html += `<div class="cv-row"><span>No technical entry yet</span></div>`;
  html += `</div>`;
  document.getElementById("printArea").innerHTML = html;
  document.getElementById("cvOverlay").classList.add("open");
}

/* ---------- CSV export ---------- */
function exportCsv(){
  const contracts = getContracts();
  const headers = ["Contract ID","Contract Name","Point Person","Bid Opening Date","Financial Status","Bidder","ABC Price","Bidder's Price","Post Qualification Date","Location of Equipment","Bid Winner","Corrections"];
  const lines = [headers.join(",")];
  const q = v => `"${(v||"").toString().replace(/"/g,'""')}"`;
  contracts.forEach(c=>{
    const t = c.tech || {};
    const rowsToWrite = c.bids.length ? c.bids : [{}];
    rowsToWrite.forEach(b=>{
      lines.push([c.cid,c.contractName,c.pointPerson,b.bidOpeningDate,b.financialStatus,b.bidder,b.abcPrice,b.biddersPrice,t.postQualDate,t.locationEquipment,t.bidWinner,t.corrections].map(q).join(","));
    });
  });
  const csv = lines.join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "bidding-monitor.csv";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
